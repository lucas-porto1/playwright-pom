name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      report-artifact-id: ${{ steps.pages-artifact.outputs.artifact_id }}
    env:
      BASE_URL: https://www.saucedemo.com
      MAIN_USER: standard_user
      MAIN_PASSWORD: secret_sauce
      LOCKED_USER: locked_out_user
      LOCKED_PASSWORD: secret_sauce
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check code quality
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload HTML report for GitHub Pages
        id: pages-artifact
        if: always() && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

  publish-report:
    name: Publish HTML report
    needs: test
    if: always() && github.ref == 'refs/heads/main' && needs.test.outputs.report-artifact-id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Add report link to the job summary
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo '## Playwright test report' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the latest HTML report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
